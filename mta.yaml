_schema-version: 3.3.0
ID: project
description: A simple CAP project.
version: 1.0.0
modules:
- name: project-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: project-db
  - name: project-destination-service
  - name: uaa_project
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    host: ${space}-project-app-api
    instances: 1
  build-parameters:
    builder: npm-ci
- name: project-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: project-db
- name: project-destination-content
  type: com.sap.application.content
  requires:
  - name: project-destination-service
    parameters:
      content-target: true
  - name: project_html_repo_host
    parameters:
      service-key:
        name: project_html_repo_host-key
  - name: uaa_project
    parameters:
      service-key:
        name: uaa_project-key
  parameters:
    content:
      instance:
        destinations:
        - Name: project_approuter_project_html_repo_host
          ServiceInstanceName: project-html5-app-host-service
          ServiceKeyName: project_html_repo_host-key
          sap.cloud.service: project_approuter
        - Authentication: OAuth2UserTokenExchange
          Name: project_approuter_uaa_project
          ServiceInstanceName: project-xsuaa-service
          ServiceKeyName: uaa_project-key
          sap.cloud.service: project_approuter
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: project-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: project_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - companymanagement.zip
      name: companymanagement
      target-path: resources/
    - artifacts:
      - userview.zip
      name: userview
      target-path: resources/
- name: companymanagement
  type: html5
  path: app/companymanagement
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: userview
  type: html5
  path: app/userview
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: project-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: project-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            HTML5.Timeout: 600000
            Name: project-app-api
            ProxyType: Internet
            Type: HTTP
            URL: https://${space}-project-app-api.${default-domain}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: project-destination-service
    service-plan: lite
- name: project_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: project-html5-app-host-service
    service-plan: app-host
- name: uaa_project
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: project-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - mkdir -p resources